name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      STATIC_DIR: .vercel/output/static
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check scripts/finalize-headers.mjs scripts/verify/browser-gates.mjs scripts/verify/csp-recorder.mjs scripts/verify/form-gates.mjs scripts/verify/header-gates.mjs scripts/verify/headers.mjs scripts/verify/seo-gates.mjs scripts/verify/static-server.mjs src/lib/finalize-headers.pure.mjs src/lib/finalize-headers.test.mjs src/lib/header-rules.test.mjs src/lib/js-ready.test.mjs src/lib/js-ready.ts src/lib/submit.test.mjs src/lib/submit.ts src/pages/api/orcamento.ts astro.config.mjs package.json vercel.json
      - run: pnpm astro sync
      - run: pnpm astro check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify/header-gates.mjs
      - run: node scripts/verify/aurora-gates.mjs
      - run: node scripts/verify/seo-gates.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify/browser-gates.mjs
      - run: node scripts/verify/form-gates.mjs
      - run: node scripts/verify/form-card-height.mjs
      - run: pnpm audit --audit-level=high
      - run: bash scripts/js-weight-check.sh "$STATIC_DIR"
      - run: bash scripts/security-check.sh --ci
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
