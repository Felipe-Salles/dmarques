name: lighthouse
on:
  deployment_status:
permissions:
  contents: read
  statuses: write
jobs:
  lhci:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify protection-bypass and build the LHCI config
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET: ${{ github.event.deployment_status.target_url }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$TARGET/")
          echo "bypass header HTTP status: $code"
          test "$code" = "200"
          jq --arg h "$BYPASS" '.ci.collect.settings.extraHeaders = {"x-vercel-protection-bypass": $h}' lighthouserc.json > "$RUNNER_TEMP/lighthouserc.ci.json"
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ github.event.deployment_status.target_url }}
          configPath: ${{ runner.temp }}/lighthouserc.ci.json
          uploadArtifacts: false
