name: headers
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headers-preview:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate deployment host
        id: target
        env:
          TARGET: ${{ github.event.deployment_status.target_url }}
        run: |
          case "$TARGET" in
            https://*.vercel.app|https://*.vercel.app/) ;;
            *) echo "host inesperado para o deployment"; exit 1 ;;
          esac
          host="${TARGET#https://}"
          host="${host%%/*}"
          case "$host" in
            *[!a-zA-Z0-9.-]*) echo "host invalido"; exit 1 ;;
          esac
      - name: Verify protection-bypass
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET: ${{ github.event.deployment_status.target_url }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $BYPASS" "$TARGET/")
          echo "bypass header HTTP status: $code"
          test "$code" = "200"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Raw curl -I
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET: ${{ github.event.deployment_status.target_url }}
        run: |
          out=$(curl -sI -H "x-vercel-protection-bypass: $BYPASS" "$TARGET/")
          echo "$out"
          for h in strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy cross-origin-resource-policy; do
            echo "$out" | grep -qi "^$h:" || { echo "cabecalho ausente: $h"; exit 1; }
          done
      - name: Header gates
        if: ${{ !cancelled() && steps.target.conclusion == 'success' }}
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify/header-gates.mjs --live --expect=enforce
      - run: pnpm exec playwright install --with-deps chromium
      - name: Form gates
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify/form-gates.mjs --live
  headers-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Raw curl -I
        run: |
          out=$(curl -sI https://agenciadmarques.com.br/)
          echo "$out"
          for h in strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy cross-origin-resource-policy; do
            echo "$out" | grep -qi "^$h:" || { echo "cabecalho ausente: $h"; exit 1; }
          done
      - name: Header gates
        if: ${{ !cancelled() }}
        env:
          PREVIEW_URL: https://agenciadmarques.com.br
        run: node scripts/verify/header-gates.mjs --live --expect=enforce
      - run: pnpm exec playwright install --with-deps chromium
      - name: Form gates
        env:
          PREVIEW_URL: https://agenciadmarques.com.br
        run: node scripts/verify/form-gates.mjs --live --check=cspCarga,cookiesZero,terceiros
